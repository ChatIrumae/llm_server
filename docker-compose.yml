version: '3.8'

services:
  # LangChain FastAPI 서버 (메인 진입점)
  langchain-server:
    build: .
    container_name: langchain-server
    ports:
      - "80:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      - ./chroma_db:/app/chroma_db
    depends_on:
      - ollama-3b
    networks:
      - llm-network
    restart: unless-stopped

  # Ollama Llama 3.2 3B 모델 서버
  ollama-3b:
    image: ollama/ollama:latest
    container_name: ollama-3b
    ports:
      - "11434:11434"
    volumes:
      - ollama_3b_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s




volumes:
  ollama_3b_data:
    driver: local

networks:
  llm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
