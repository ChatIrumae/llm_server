version: '3.8'

services:
  # FastAPI 서버 (OpenAI API 사용)
  langchain-server:
    build: .
    container_name: irumae-llm-server
    ports:
      - "80:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5}
    volumes:
      - ./:/app
      - ./chroma_db:/app/chroma_db
    networks:
      - llm-network
    restart: unless-stopped




networks:
  llm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
